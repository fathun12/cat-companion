<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Kustomisasi Kucing</title>
  <style>
    @font-face {
      font-family: 'Pixelify Sans';
      font-weight: 400;
      src: url('../../../node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-400-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Pixelify Sans';
      font-weight: 700;
      src: url('../../../node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-700-normal.woff2') format('woff2');
    }
    :root {
      --ink: #2b2140;
      --cream: #fff3d6;
      --pink: #ff8fb1;
      --mint: #7ae0c3;
      --butter: #ffd65a;
      --lav: #b9a4ff;
      --gray: #cfc6b4;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--cream);
      background-image: radial-gradient(#e9d9ae 1.5px, transparent 1.5px);
      background-size: 16px 16px;
      color: var(--ink);
      font-family: 'Pixelify Sans', 'Courier New', monospace;
      font-size: 15px;
    }

    /* ===== Kepala dan tab ===== */
    .title {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: var(--lav);
      border-bottom: 4px solid var(--ink);
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .dots i {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-left: 5px;
      background: var(--ink);
    }
    .tabs {
      flex: none;
      display: flex;
      gap: 8px;
      padding: 10px 14px 0;
      border-bottom: 4px solid var(--ink);
      background: var(--butter);
    }
    .tab {
      padding: 6px 14px 5px;
      border: 4px solid var(--ink);
      border-bottom: none;
      background: var(--cream);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
    }
    .tab:hover { background: #fff; }
    .tab.on { background: var(--pink); padding-bottom: 9px; margin-bottom: -4px; }

    /* ===== Isi ===== */
    #content { flex: 1; overflow-y: auto; padding: 16px 14px 24px; }
    .pane { display: none; }
    .pane.on { display: block; }
    .pane > * + * { margin-top: 16px; }
    ::-webkit-scrollbar { width: 14px; }
    ::-webkit-scrollbar-track { background: var(--cream); border-left: 4px solid var(--ink); }
    ::-webkit-scrollbar-thumb { background: var(--lav); border: 3px solid var(--ink); }

    .card {
      padding: 12px;
      background: #fff;
      border: 4px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
    }
    .c-mint { background: #ddf6ee; }
    .c-pink { background: #ffe3ec; }
    .c-lav { background: #ece6ff; }
    .c-butter { background: #fff0b8; }
    .tag {
      display: inline-block;
      margin-bottom: 10px;
      padding: 1px 8px;
      background: var(--ink);
      color: var(--cream);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #previewBox {
      display: flex;
      justify-content: center;
      padding: 10px;
      border: 4px solid var(--ink);
      background: repeating-conic-gradient(#d9d2c0 0% 25%, #f1ead8 0% 50%) 50% / 24px 24px;
    }
    #preview { width: 256px; height: 256px; image-rendering: pixelated; }

    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 0;
    }
    label:last-child { margin-bottom: 0; }

    button { font-family: inherit; }
    .chip, .msg button, #mAdd {
      padding: 4px 12px;
      border: 3px solid var(--ink);
      background: var(--cream);
      box-shadow: 3px 3px 0 var(--ink);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
    }
    .chip:hover, .msg button:hover, #mAdd:hover { background: var(--butter); }
    .chip:active, .msg button:active, #mAdd:active { transform: translate(3px, 3px); box-shadow: none; }
    #mAdd { background: var(--mint); }
    .msg button { background: var(--pink); padding: 2px 8px; font-size: 13px; }

    input[type=color] {
      width: 60px;
      height: 32px;
      padding: 0;
      border: 3px solid var(--ink);
      background: var(--cream);
      box-shadow: 2px 2px 0 var(--ink);
      cursor: pointer;
    }
    input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
    input[type=color]::-webkit-color-swatch { border: none; }

    select, input[type=text], input[type=time], textarea {
      padding: 5px 8px;
      border: 3px solid var(--ink);
      background: var(--cream);
      color: var(--ink);
      font: inherit;
      outline: none;
    }
    select { cursor: pointer; font-weight: 700; }
    input[type=text]:focus, input[type=time]:focus, textarea:focus, select:focus { background: #fff; box-shadow: 3px 3px 0 var(--lav); }
    textarea { width: 100%; resize: none; }

    .msg {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 7px 10px;
      border: 3px solid var(--ink);
      background: var(--cream);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .msg .t { padding: 0 6px; background: var(--ink); color: var(--butter); font-weight: 700; }
    .msg .x { flex: 1; word-break: break-word; }
    input[type=checkbox] {
      appearance: none;
      flex: none;
      width: 20px;
      height: 20px;
      margin: 0;
      border: 3px solid var(--ink);
      background: var(--cream);
      cursor: pointer;
    }
    input[type=checkbox]:checked { background: var(--ink); box-shadow: inset 0 0 0 3px var(--mint); }
    .hint { margin-top: 8px; font-size: 13px; color: #6a5d80; }
  </style>
</head>
<body>
  <div class="title"><span>Kustomisasi Kucing</span><span class="dots"><i></i><i></i><i></i></span></div>
  <div class="tabs">
    <button class="tab on" data-tab="look">Tampilan</button>
    <button class="tab" data-tab="note">Catatan</button>
    <button class="tab" data-tab="msg">Pesan</button>
  </div>

  <div id="content">
    <!-- ===== Tab Tampilan ===== -->
    <div class="pane on" id="pane-look">
      <div id="previewBox"><canvas id="preview"></canvas></div>

      <div class="card c-butter">
        <div class="tag">Preset</div>
        <div class="row" id="presets"></div>
      </div>

      <div class="card c-mint">
        <div class="tag">Warna</div>
        <label>Warna badan <input type="color" id="cBody" /></label>
        <label>Garis tepi <input type="color" id="cOutline" /></label>
        <label>Warna pola <input type="color" id="cP1" /></label>
        <label>Warna pola 2 (calico) <input type="color" id="cP2" /></label>
      </div>

      <div class="card c-pink">
        <div class="tag">Pola</div>
        <label>
          Jenis pola
          <select id="pattern">
            <option value="polos">Polos</option>
            <option value="belang">Belang</option>
            <option value="tuxedo">Tuxedo</option>
            <option value="calico">Calico</option>
          </select>
        </label>
      </div>
    </div>

    <!-- ===== Tab Catatan ===== -->
    <div class="pane" id="pane-note">
      <div class="card c-butter">
        <div class="tag">Catatan sematan</div>
        <textarea id="note" maxlength="80" rows="3" placeholder="Tampil di atas kepala kucing (kosongkan untuk menyembunyikan)"></textarea>
        <div class="hint">Maksimal 80 karakter. Tersimpan otomatis.</div>
      </div>
    </div>

    <!-- ===== Tab Pesan ===== -->
    <div class="pane" id="pane-msg">
      <div class="card c-lav">
        <div class="tag">Pesan pengingat</div>
        <label>Nama panggilan <input type="text" id="uName" maxlength="20" placeholder="opsional" /></label>
        <div class="row" style="margin-top: 12px">
          <input type="time" id="mTime" value="09:00" />
          <input type="text" id="mText" maxlength="60" placeholder="Isi pesan" style="flex: 1; min-width: 120px" />
          <button id="mAdd">Tambah</button>
        </div>
        <div id="mList"></div>
        <div class="hint">Pesan muncul sekali sehari pada jam yang dipilih.</div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
