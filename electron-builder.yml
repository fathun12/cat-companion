appId: com.catcompanion.app
productName: Cat Companion
directories:
  output: release
  buildResources: build
files:
  - main.js
  - package.json
  - src/**/*
  - assets/**/*
  - "!**/*.ts"
asarUnpack:
  - node_modules/uiohook-napi/**
electronLanguages:
  - en-US
  - id
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Cat Companion